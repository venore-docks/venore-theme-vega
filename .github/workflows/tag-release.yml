name: Tag da versão

# Cria a tag v<version> quando o package.json chega no master com uma versão ainda sem tag. As
# instâncias do Venore Docks instalam o tema por tag (`#vX.Y.Z` no package.json) e o /admin/themes
# só oferece atualização para tags semver — então "subir a versão no package.json" basta para
# publicar. Tag já existente não é tocada.
on:
  push:
    branches: [master]
    paths: [package.json, .github/workflows/tag-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar tag da versão
        run: |
          version=$(jq -r .version package.json)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versão \"$version\" não é semver X.Y.Z"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag já existe — nada a fazer."
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "Criada $tag em $(git rev-parse --short HEAD)."
